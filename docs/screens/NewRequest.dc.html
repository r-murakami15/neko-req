<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新規作成</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121418}
a{color:#E7E9EC}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 560px; height: 560px; box-sizing: border-box; background: #191C21; color: #E7E9EC; font-family: Inter, 'Noto Sans JP', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; border: 1px solid #2B3038; border-radius: 12px; overflow: hidden;">
  <header style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #2B3038;">
    <h1 style="margin: 0; font-size: 16px; font-weight: 600;">新規作成</h1>
    <a href="Main.dc.html" aria-label="閉じる" style="margin-left: auto; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; color: #A0A8B3; text-decoration: none;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
  </header>
  <div style="flex: 1 1 auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid {{accent}}; border-radius: 10px; background: #221E33; text-decoration: none; color: #E7E9EC;">
        <span style="font-weight: 600;">HTTP リクエスト</span>
        <span style="color: #A0A8B3; font-size: 12px;">空のリクエストを新しいタブで開く</span>
      </a>
      <button style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid #343A44; border-radius: 10px; background: #1F232A; color: #E7E9EC; font: inherit; text-align: left;">
        <span style="font-weight: 600;">フォルダ</span>
        <span style="color: #A0A8B3; font-size: 12px;">リクエストをまとめる</span>
      </button>
      <button style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid #343A44; border-radius: 10px; background: #1F232A; color: #E7E9EC; font: inherit; text-align: left;">
        <span style="font-weight: 600;">プロジェクト</span>
        <span style="color: #A0A8B3; font-size: 12px;">新しい保存フォルダを作る</span>
      </button>
      <a href="OpenApiImport.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid #343A44; border-radius: 10px; background: #1F232A; text-decoration: none; color: #E7E9EC;">
        <span style="font-weight: 600;">OpenAPI から</span>
        <span style="color: #A0A8B3; font-size: 12px;">YAML / JSON を取り込む</span>
      </a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; color: #A0A8B3;">cURL コマンドから作成
      <textarea rows="5" style="padding: 10px 12px; border: 1px solid #343A44; border-radius: 8px; background: #16191E; color: #C9CED6; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; resize: none;">curl -X POST http://localhost:8080/api/v1/auth/password-login \
  -H 'Content-Type: application/json' \
  -d '{"email":"user@example.com","password":"********"}'</textarea>
    </label>
    <div style="display: flex; gap: 8px; align-items: center; color: #6FE0A6; font-size: 12px;"><span aria-hidden="true">✓</span>POST /api/v1/auth/password-login · JSON ボディ · OpenAPI の createPasswordLogin と一致</div>
  </div>
  <footer style="display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid #2B3038; background: #16191E;">
    <a href="Main.dc.html" style="height: 36px; display: inline-flex; align-items: center; padding: 0 16px; border: 1px solid #343A44; border-radius: 8px; color: #E7E9EC; text-decoration: none;">キャンセル</a>
    <a href="RequestBody.dc.html" style="height: 36px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 8px; background: {{accent}}; color: #121418; font-weight: 600; text-decoration: none;">cURL から作成</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A78BFA","options":["#A78BFA","#B794FF","#C4B5FD","#9F7AEA"]},"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A78BFA' };
  }
}
</script>
</body>
</html>
