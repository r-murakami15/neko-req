name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # 開発コンテナ（docker/Dockerfile）と同じ Rust 1.90 に固定する（新しい版の clippy の lint で落ちないように）
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 画面を先に確認する（tauri の生成コードが dist/ を要るので、Rust より前にビルドする）
      - run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend test
        run: npm test
      - name: Frontend build
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # export_bindings テストが src/bindings.ts を書き出す。コミット済みのものと違えば、生成し忘れ
      - name: bindings.ts is up to date
        run: git diff --exit-code src/bindings.ts
